name: Update-UPM-Branch

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish }}

      - name: Extract version from tag
        id: tag
        run: |
          RAW_TAG='${{ github.event.release.tag_name }}'
          VERSION="${RAW_TAG#v}"
          echo "raw=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        
      - name: Update package version
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          pkg_path = pathlib.Path('packages/NDMF-Merge/package.json')
          data = json.loads(pkg_path.read_text(encoding='utf-8'))
          data['version'] = os.environ['PACKAGE_VERSION']
          pkg_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
        env:
          PACKAGE_VERSION: ${{ steps.tag.outputs.version }}

      - name: Commit version bump back to branch
        run: |
          if git diff --quiet -- packages/NDMF-Merge/package.json; then
            echo "No package version change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/NDMF-Merge/package.json
          git commit -m "chore: bump package version to ${{ steps.tag.outputs.version }}"
          git push origin HEAD:${{ github.event.release.target_commitish }}

      - name: Create UPM Branch
        uses: hecomi/create-upm-branch-action@main
        with:
          git-tag: ${{ steps.tag.outputs.raw }}
          pkg-root-dir-path: packages/NDMF-Merge
          root-files: README.md LICENSE.txt
